<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>browsHER</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="start-overlay">
        <h2>Click to Wake Up browsHER</h2>
    </div>

    <div id="loading-screen" class="hidden">
        <h1 class="loading-text">Opening browsHER</h1>
        <div class="loading-bar-container">
            <div id="loading-bar"></div>
        </div>
        <button id="open-btn" class="hidden">OPEN</button>
    </div>

    <div id="homepage" class="hidden">
        <div class="top-widgets">
            <div class="glass-bubble widget">
                <div class="time-date">
                    <span id="time">00:00</span><br>
                    <span id="date-text" class="interactive"><span id="dd" class="red-text">DD</span>/MM/YY</span>
                </div>
                <div id="fact-cloud" class="cloud hidden">Fetching fact...</div>
            </div>

            <div class="glass-bubble widget">
                <span id="eksathe-counter">Eksathe for 0 days</span>
            </div>
        </div>

        <div class="search-container">
            <form action="https://www.google.com/search" method="get">
                <input type="text" name="q" class="glass-bubble search-bar" placeholder="Search the web..." autocomplete="off">
            </form>
        </div>

        <div class="emotion-section">
            <h2 class="emotion-title">HOW ARE YOU FEELING TODAY, SONA?</h2>
            <div class="emotion-bubbles">
                <button class="glass-bubble emotion-btn" data-emotion="Angry" style="--btn-color: #ff4d4d;">Angry</button>
                <button class="glass-bubble emotion-btn" data-emotion="Sad" style="--btn-color: #4da6ff;">Sad</button>
                <button class="glass-bubble emotion-btn" data-emotion="Happy" style="--btn-color: #ffdd4d;">Happy</button>
                <button class="glass-bubble emotion-btn" data-emotion="Bored" style="--btn-color: #a6a6a6;">Bored</button>
                <button class="glass-bubble emotion-btn" data-emotion="Nervous" style="--btn-color: #b366ff;">Nervous</button>
                <button class="glass-bubble emotion-btn" data-emotion="Lonely" style="--btn-color: #4dffff;">Lonely</button>
            </div>
            <div id="emotion-response" class="glass-bubble hidden"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
