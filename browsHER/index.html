<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>browsHER</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;600;700;800&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- ═══════════════════ LOADING SCREEN ═══════════════════ -->
  <div id="loading">
    <div class="loading-content">
      <p class="loading-eyebrow">Welcome back</p>
      <h1 id="loadingTitle">Opening browsHER</h1>
      <div class="loading-bar-track">
        <div class="loading-bar-fill" id="loadingBarFill"></div>
      </div>
      <p class="loading-pct" id="loadingPct">0%</p>
      <button id="openBtn" class="boba-btn" aria-label="Open browsHER">
        <span class="boba-btn-inner">
          <span class="boba-icon">🧋</span>
          <span class="boba-label">Open</span>
        </span>
      </button>
    </div>
    <audio id="bunnyAudio" src="assets/bunny.mp3" preload="auto"></audio>
  </div>

  <!-- ═══════════════════ MAIN HOME ═══════════════════ -->
  <div id="main" class="hidden">

    <!-- BG GIFs -->
    <div id="bgLayer">
      <img id="dayGif"   src="assets/video/day.gif"   alt="" class="bg-gif" draggable="false">
      <img id="nightGif" src="assets/video/night.gif" alt="" class="bg-gif" draggable="false">
      <div id="bgOverlay"></div>
    </div>

    <!-- ── SEARCH BAR (top-center) ── -->
    <div id="searchWrap">
      <div class="search-glass" id="searchGlass">
        <span class="search-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </span>
        <input id="searchInput" type="text" placeholder="Search Google or type a URL…" autocomplete="off" spellcheck="false">
        <button id="searchBtn" aria-label="Search">Go</button>
      </div>
    </div>

    <!-- ── WIDGETS (top-right) ── -->
    <aside id="widgets">

      <!-- Time & Date widget -->
      <div class="widget" id="timeWidget" role="button" tabindex="0" aria-label="Click to see today's fact">
        <div class="widget-time" id="widgetTime">00:00:00</div>
        <div class="widget-date" id="widgetDate">
          <span class="date-day" id="dateDay">01</span>/<span id="dateMon">01</span>/<span id="dateYear">25</span>
        </div>
        <div class="widget-hint">tap for today's fact ✨</div>
      </div>

      <!-- Eksathe widget -->
      <div class="widget" id="daysWidget">
        <div class="widget-eksathe-label">Eksathe for</div>
        <div class="widget-eksathe-count" id="daysCount">— days</div>
      </div>

    </aside>

    <!-- ── FACT CLOUD ── -->
    <div id="factCloud" class="cloud-popup hidden" role="dialog" aria-label="Fact about today">
      <div class="cloud-body">
        <div id="factContent">Loading…</div>
        <button class="cloud-close" id="factClose" aria-label="Close fact">✕</button>
      </div>
    </div>

    <!-- ── SCROLL AREA ── -->
    <div id="scrollArea">

      <!-- spacer so emotions appear below fold (scroll-reveal) -->
      <div class="spacer-hero"></div>

      <!-- EMOTION SECTION -->
      <section id="emotionSection">
        <h2 id="emotionHeading">HOW ARE YOU FEELING TODAY, SONA?</h2>
        <div id="emotionBubbles" role="list"></div>
      </section>

      <!-- EMOTION HISTORY (optional toggle) -->
      <section id="historySection">
        <button class="history-toggle" id="historyToggle">📖 View feeling history</button>
        <div id="historyList" class="hidden"></div>
      </section>

    </div>

    <!-- ── EMOTION POPUP ── -->
    <div id="emotionPopup" class="emotion-popup hidden" role="dialog">
      <div class="emotion-popup-inner">
        <span class="ep-emoji" id="epEmoji"></span>
        <h3 class="ep-name" id="epName"></h3>
        <p class="ep-msg" id="epMsg"></p>
        <button class="ep-close" id="epClose">Close</button>
      </div>
    </div>

  </div>

  <script src="js/script.js"></script>
</body>
</html>
